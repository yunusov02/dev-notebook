[project]
name = "beyond-crud"
version = "0.1.0"
description = "Fast API CRUD application with advanced features"
readme = "README.md"
authors = [
    { name = "Asilbek Yunusov", email = "as.yunusov@agmk.uz" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
]

[project.scripts]
beyond-crud = "beyond_crud:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
