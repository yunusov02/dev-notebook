[project]
name = "beyond-crud"
version = "0.1.0"
description = "Fast API CRUD application with advanced features"
readme = "README.md"
authors = [
    { name = "Asilbek Yunusov", email = "as.yunusov@agmk.uz" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.5",
    "passlib[bcrypt]>=1.7.4",
    "psycopg>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqlmodel>=0.0.49",
]

[project.scripts]
beyond-crud = "beyond_crud:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
